<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الدلتا لدهانات الألومنيوم | تواصل معنا</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#052a5e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #052a5e;
    --navy-deep: #031c40;
    --ink: #0e1b33;
    --muted: #5f6b80;
    --red: #e10600;
    --bg: #eef1f7;
    --card: #ffffff;
    --line: #e4e8f0;
    --wa: #1fa855;
    --wa-2: #178a45;
    --fb: #1877f2;
    --fb-2: #1262cf;
    --font: "Alexandria", "Segoe UI", Tahoma, Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; max-width: 100%; overflow-x: clip; }
  body {
    min-height: 100vh;
    font-family: var(--font);
    color: var(--ink);
    background: var(--bg);
    display: flex;
    justify-content: center;
    padding: 22px 16px 40px;
    position: relative;
  }
  main { width: 100%; max-width: 440px; position: relative; z-index: 1; }

  .sheet {
    background: var(--card);
    border-radius: 30px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(5, 42, 94, .18), 0 2px 6px rgba(5, 42, 94, .08);
  }

  /* ---------- الهيدر الكحلي ---------- */
  .hero {
    position: relative;
    padding: 44px 26px 74px;
    background: linear-gradient(160deg, var(--navy) 0%, var(--navy-deep) 100%);
    /* حافة سفلية مقطوعة على شكل مثلث الـ Λ */
    clip-path: polygon(0 0, 100% 0, 100% 100%, calc(50% + 46px) 100%, 50% calc(100% - 34px), calc(50% - 46px) 100%, 0 100%);
  }
  .hero::before { /* مثلث باهت كبير من اللوجو */
    content: "";
    position: absolute;
    width: 240px; height: 208px;
    left: -70px; bottom: -40px;
    background: #fff;
    opacity: .05;
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
  }
  .logo { position: relative; display: block; width: 100%; max-width: 340px; height: auto; margin: 0 auto; }

  /* ---------- المحتوى ---------- */
  .content { padding: 20px 22px 26px; }
  h1 {
    margin: 0 0 4px;
    font-size: 1.6rem;
    font-weight: 800;
    text-align: center;
    color: var(--navy);
    letter-spacing: -.01em;
  }
  .sub { margin: 0 0 22px; text-align: center; color: var(--muted); font-size: .98rem; }

  .cta {
    display: grid;
    grid-template-columns: 56px 1fr 22px;
    align-items: center;
    gap: 14px;
    width: 100%;
    min-height: 84px;
    padding: 14px 18px;
    margin-bottom: 12px;
    border-radius: 20px;
    color: #fff;
    text-decoration: none;
    position: relative;
    overflow: hidden;
    transition: transform .12s ease;
  }
  .cta::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0) 55%);
    pointer-events: none;
  }
  .cta:hover { transform: translateY(-1px); }
  .cta:active { transform: scale(.985); }
  .cta.wa { background: linear-gradient(135deg, var(--wa), var(--wa-2)); box-shadow: 0 12px 24px rgba(31,168,85,.30); }
  .cta.fb { background: linear-gradient(135deg, var(--fb), var(--fb-2)); box-shadow: 0 12px 24px rgba(24,119,242,.26); }
  .cta .ico {
    width: 56px; height: 56px; border-radius: 16px;
    display: grid; place-items: center;
    background: rgba(255,255,255,.2);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.25);
  }
  .cta .ico svg { width: 30px; height: 30px; }
  .cta .t { display: block; font-size: 1.28rem; font-weight: 800; line-height: 1.25; }
  .cta .s { display: block; margin-top: 3px; font-size: .9rem; font-weight: 400; opacity: .92; }
  .cta .chev { width: 20px; height: 20px; opacity: .85; transform: scaleX(-1); }

  .calls { margin-top: 26px; }
  .calls h2 {
    margin: 0 2px 10px;
    font-size: .98rem;
    font-weight: 600;
    color: var(--muted);
    display: flex; align-items: center; gap: 12px;
  }
  .calls h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .list {
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
    background: #fbfcfe;
  }
  .call {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    min-height: 66px;
    padding: 10px 18px;
    color: var(--ink);
    text-decoration: none;
    transition: background .15s ease;
  }
  .call + .call { border-top: 1px solid var(--line); }
  .call:hover, .call:active { background: #f1f5fb; }
  .call .num {
    direction: ltr; unicode-bidi: isolate;
    font-size: 1.3rem; font-weight: 600;
    font-variant-numeric: tabular-nums; letter-spacing: .02em;
    color: var(--navy);
  }
  .call .ring {
    width: 42px; height: 42px; flex: none; border-radius: 50%;
    display: grid; place-items: center;
    color: var(--navy);
    background: #e8eefa;
  }
  .call:hover .ring, .call:active .ring { background: var(--navy); color: #fff; }
  .call .ring svg { width: 19px; height: 19px; }

  .save {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; min-height: 58px; margin-top: 14px; padding: 12px 18px;
    border: 2px solid var(--navy); border-radius: 16px;
    background: transparent; color: var(--navy);
    font: inherit; font-size: 1.05rem; font-weight: 600;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .save svg { width: 22px; height: 22px; }
  .save:hover, .save:active { background: var(--navy); color: #fff; }


  /* ---------- شكل زرار واتساب/فيسبوك: مسطح بحافة سفلية ---------- */
  .cta { border-radius: 18px; min-height: 88px; box-shadow: none; border-bottom: 5px solid; transition: border-bottom-width .1s ease, margin .1s ease; }
  .cta::after { display: none; }
  .cta.wa { background: var(--wa); border-color: #12753a; box-shadow: none; }
  .cta.fb { background: var(--fb); border-color: #0e4fb0; box-shadow: none; }
  .cta:hover { transform: none; }
  .cta:active { transform: none; border-bottom-width: 1px; margin-top: 4px; margin-bottom: 8px; }
  .cta .ico { width: 58px; height: 58px; border-radius: 50%; background: #fff; box-shadow: none; }
  .cta.wa .ico { color: var(--wa-2); }
  .cta.fb .ico { color: var(--fb); }
  .cta .ico svg { width: 32px; height: 32px; }

  a:focus-visible, .save:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }
  .cta:focus-visible { outline-offset: -4px; outline-color: #fff; }

  @media (prefers-reduced-motion: reduce) {
    .cta, .call, .save { transition: none; }
  }
  @media (max-width: 340px) {
    .content { padding: 16px 14px 20px; }
    .hero { padding: 36px 18px 68px; }
    .cta { grid-template-columns: 46px 1fr 18px; gap: 10px; padding: 12px; }
    .cta .ico { width: 46px; height: 46px; }
    .call .num { font-size: 1.15rem; }
  }
</style>
</head>
