<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الدلتا لدهانات الألومنيوم | تواصل معنا</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#052a5e">
<style>
  :root {
    --navy: #052a5e;
    --navy-2: #0a3d85;
    --red: #e60000;
    --bg: #eef2f9;
    --card: #ffffff;
    --text: #12203a;
    --muted: #5d6679;
    --fb: #1877f2;
    --wa: #1fa855;
    --line: #e3e8f2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Segoe UI", "Noto Naskh Arabic", "Noto Sans Arabic", Tahoma, Arial, sans-serif;
    background:
      radial-gradient(900px 380px at 50% -120px, rgba(5,42,94,.14), transparent 70%),
      var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 20px 16px 32px;
    min-height: 100vh;
  }
  main {
    width: 100%;
    max-width: 440px;
    margin: auto;
    background: var(--card);
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 14px 44px rgba(5, 42, 94, .16);
  }
  .top { padding: 30px 26px 22px; text-align: center; border-bottom: 1px solid var(--line); }
  .top::after {
    content: ""; display: block; width: 64px; height: 4px; margin: 20px auto 0;
    border-radius: 4px; background: linear-gradient(90deg, var(--navy) 0 66%, var(--red) 66% 100%);
  }
  .logo { display: block; width: 100%; max-width: 330px; height: auto; margin: 0 auto; }
  .body { padding: 24px 22px 8px; }
  h1 { margin: 0 0 6px; font-size: 1.35rem; text-align: center; color: var(--navy); }
  p.sub { margin: 0 0 22px; color: var(--muted); font-size: .98rem; text-align: center; }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    width: 100%; min-height: 62px; padding: 16px 20px; margin-bottom: 12px;
    border-radius: 16px; color: #fff; text-decoration: none;
    font-size: 1.12rem; font-weight: 700;
    box-shadow: 0 4px 14px rgba(0,0,0,.12);
    transition: transform .08s ease, filter .15s ease;
  }
  .btn:active { transform: scale(.98); }
  .btn:hover { filter: brightness(1.06); }
  .btn:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  .btn svg { width: 26px; height: 26px; flex: none; }
  .wa { background: var(--wa); }
  .fb { background: var(--fb); }

  .divider {
    display: flex; align-items: center; gap: 12px; margin: 22px 0 14px;
    color: var(--muted); font-size: .92rem; font-weight: 600;
  }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .call {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; min-height: 58px; padding: 12px 18px; margin-bottom: 10px;
    border: 2px solid var(--navy); border-radius: 14px;
    background: #fff; color: var(--navy); text-decoration: none; font-weight: 700;
    transition: background .15s ease, color .15s ease, transform .08s ease;
  }
  .call:hover, .call:active { background: var(--navy); color: #fff; }
  .call:active { transform: scale(.98); }
  .call:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  .call svg { width: 22px; height: 22px; flex: none; }
  .call .lbl { font-size: .95rem; }
  .call .num { direction: ltr; unicode-bidi: isolate; font-size: 1.15rem; letter-spacing: .5px; }

  footer { padding: 14px 22px 24px; color: var(--muted); font-size: .82rem; text-align: center; }
</style>
</head>
<body>
<main>
  <div class="top">
    <img class="logo" src="logo.png" alt="الدلتا لدهانات الألومنيوم - Delta for Aluminum Paints" width="900" height="173">
  </div>

  <div class="body">
    <h1>تواصل معنا</h1>
    <p class="sub">اختر الطريقة المناسبة لك</p>

    <a class="btn wa" id="wa" href="#" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.5-5.1A8 8 0 1 1 21 12z"/></svg>
      <span>راسلنا على واتساب</span>
    </a>

    <a class="btn fb" id="fb" href="#" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 21v-7.5h2.6l.4-3h-3V8.7c0-.9.3-1.5 1.5-1.5h1.6V4.5c-.3 0-1.2-.1-2.3-.1-2.3 0-3.8 1.4-3.8 3.9v2.2H7.9v3h2.6V21h3z"/></svg>
      <span>تابع صفحتنا على فيسبوك</span>
    </a>

    <div class="divider">أو اتصل بنا مباشرة</div>
    <div id="phones"></div>
  </div>

  <footer>اضغط على الزر الذي تريده للفتح مباشرة</footer>
</main>

<script>
  /* ====== الإعدادات: الروابط والأرقام اللي بتتغير لو احتجت تعدّل ====== */
  var CONFIG = {
    facebook: "https://www.facebook.com/share/1SeXtc2CTw/?mibextid=wwXIfr",
    whatsapp: "https://wa.me/mohamed_arafa2000?s=p",
    phones: ["01148730450", "01010792212", "01152048696"]
  };
  /* ==================================================================== */
  document.getElementById("fb").href = CONFIG.facebook;
  document.getElementById("wa").href = CONFIG.whatsapp;

  var icon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>';
  var box = document.getElementById("phones");
  CONFIG.phones.forEach(function (p) {
    var intl = "+20" + p.replace(/^0/, "");
    var a = document.createElement("a");
    a.className = "call";
    a.href = "tel:" + intl;
    a.innerHTML = icon + '<span class="lbl">اتصال</span><span class="num"></span>';
    a.querySelector(".num").textContent = p;
    box.appendChild(a);
  });
</script>
</body>
</html>
